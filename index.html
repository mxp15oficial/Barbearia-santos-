<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento Barbearia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Agendar Corte de Cabelo</h1>
    
    <!-- Seleção de Data -->
    <div class="field">
      <label for="data">Escolha a data:</label>
      <input type="date" id="data">
    </div>

    <button id="btnVerificar">Verificar Vagas</button>

    <!-- Área de seleção -->
    <div id="areaBarbeiro" class="hidden">
      <h3>Vaga disponível! Escolha o barbeiro:</h3>
      <select id="selectBarbeiro">
        <option value="Santos">Santos (Dono)</option>
        <option value="" disabled>-- Vaga para novo barbeiro --</option>
      </select>
      
      <h3>Escolha o serviço:</h3>
      <!-- Botão para abrir o catálogo de cortes -->
      <button type="button" id="btnAbrirCortes" class="btn-corte">
        <span id="textoCorteSelecionado">Escolha o Corte de Cabelo</span>
      </button>

      <button id="btnConfirmar">Confirmar Agendamento</button>
    </div>

    <div id="mensagem"></div>
  </div>

  <!-- Modal do Catálogo de Cortes -->
  <div id="modalCortes" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Selecione o Corte</h2>
        <span id="btnFecharModal" class="close">&times;</span>
      </div>
      
      <!-- Grade 2x2 com imagens e títulos -->
      <div class="grid-cortes">
        
        <div class="card-corte" data-corte="Degradê Normal">
          <div class="img-box">
            <img src="https://via.placeholder.com/150?text=Degrade+Normal" alt="Degradê Normal">
          </div>
          <p>Degradê Normal</p>
        </div>

        <div class="card-corte" data-corte="Degradê Navalhado">
          <div class="img-box">
            <img src="https://via.placeholder.com/150?text=Degrade+Navalhado" alt="Degradê Navalhado">
          </div>
          <p>Degradê Navalhado</p>
        </div>

        <div class="card-corte" data-corte="Corte CR7">
          <div class="img-box">
            <img src="https://via.placeholder.com/150?text=Corte+CR7" alt="Corte CR7">
          </div>
          <p>Corte CR7</p>
        </div>

        <div class="card-corte" data-corte="Social Tradicional">
          <div class="img-box">
            <img src="https://via.placeholder.com/150?text=Social" alt="Social Tradicional">
          </div>
          <p>Social Tradicional</p>
        </div>

        <div class="card-corte" data-corte="Militar / Buzz Cut">
          <div class="img-box">
            <img src="https://via.placeholder.com/150?text=Militar" alt="Militar">
          </div>
          <p>Militar</p>
        </div>

        <div class="card-corte" data-corte="Mullet Moderno">
          <div class="img-box">
            <img src="https://via.placeholder.com/150?text=Mullet" alt="Mullet Moderno">
          </div>
          <p>Mullet Moderno</p>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
